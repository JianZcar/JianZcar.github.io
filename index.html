<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JianZcar</title>
    <meta
      name="description"
      content="JianZcar is a Systems Software and Infrastructure Engineer. He helps projects and businesses turn complex technical problems into minimal, straightforward solutions."
    />
    <link
      rel="preload"
      as="image"
      href="/img/my-pic-768.webp"
      imagesrcset="
        /img/my-pic-384.webp   384w,
        /img/my-pic-768.webp   768w,
        /img/my-pic-1024.webp 1024w
      "
      imagesizes="(min-width: 1280px) 496px, (min-width: 640px) 45vw, 100vw"
      fetchpriority="high"
    />
    <style>
      body {
        margin: 0;
      }

      :root {
        --scrollbar-size: 10px;
        --scrollbar-thumb: #9ad5ca;
        --scrollbar-thumb-hover: #2978a0;
        --scrollbar-thumb-active: #315659;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) transparent;
      }

      ::-webkit-scrollbar {
        width: var(--scrollbar-size);
        height: var(--scrollbar-size);
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb);
        border: 2px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
        transition: background-color 0.2s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-thumb-hover);
      }

      ::-webkit-scrollbar-thumb:active {
        background-color: var(--scrollbar-thumb-active);
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/inter-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Syncopate";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/syncopate-400-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Syncopate";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/syncopate-700-latin.woff2") format("woff2");
      }
    </style>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/syncopate-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/syncopate-700-latin.woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="app-viewport">
      <app-root></app-root>
    </main>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
