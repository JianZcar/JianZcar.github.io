<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JianZcar</title>
    <meta
      name="description"
      content="JianZcar is a Systems Software and Infrastructure Engineer. He helps projects and businesses turn complex technical problems into minimal, straightforward solutions."
    />
    <link
      rel="preload"
      as="image"
      href="/img/my-pic-768.webp"
      imagesrcset="
        /img/my-pic-384.webp   384w,
        /img/my-pic-768.webp   768w,
        /img/my-pic-1024.webp 1024w

      imagesizes="(min-width: 1280px) 496px, (min-width: 640px) 45vw, 100vw"
      fetchpriority="high"
    />

      body {
        margin: 0;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap"
    />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <main id="app-viewport">
      <app-root></app-root>
