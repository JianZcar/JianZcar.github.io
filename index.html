<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JianZcar</title>
    <meta
      name="description"
      content="JianZcar is a Systems Software and Infrastructure Engineer. He helps projects and businesses turn complex technical problems into minimal, straightforward solutions."
    />
    <link
      rel="preload"
      as="image"
      href="/img/my-pic-768.webp"
      imagesrcset="
        /img/my-pic-384.webp   384w,
        /img/my-pic-768.webp   768w,
        /img/my-pic-1024.webp 1024w
      "
      imagesizes="(min-width: 1280px) 496px, (min-width: 640px) 45vw, 100vw"
      fetchpriority="high"
    />
    <style>
      body {
        margin: 0;
      }

      :root {
        --scrollbar-size: 10px;
        --scrollbar-thumb: #9ad5ca;
        --scrollbar-thumb-hover: #2978a0;
        --scrollbar-thumb-active: #315659;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) transparent;
      }

      ::-webkit-scrollbar {
        width: var(--scrollbar-size);
        height: var(--scrollbar-size);
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb);
        border: 2px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
        transition: background-color 0.2s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-thumb-hover);
      }

      ::-webkit-scrollbar-thumb:active {
        background-color: var(--scrollbar-thumb-active);
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <main id="app-viewport">
      <app-root></app-root>
    </main>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
